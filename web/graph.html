<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8ecf5">
<title>Bullrun graphs</title>
<script>
(function () {
  var m = localStorage.getItem('br_theme') || 'auto';
  var d = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
})();
</script>
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
html,body{height:auto;overflow:auto}
input{background:var(--well);border:0;border-radius:18px;padding:13px 16px;width:100%;box-shadow:var(--inset);color:var(--ink)}
input:focus{outline:none;box-shadow:var(--inset),0 0 0 3px rgba(139,143,255,.5)}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .box{width:min(400px,100%);display:grid;gap:16px;background:var(--sf);box-shadow:var(--clay);border-radius:34px;padding:32px}
.gate h1{font-size:36px;letter-spacing:-.04em;font-weight:900}
.btn{display:inline-block;width:auto;padding:12px 20px;font-size:14px}.btn.full{display:block;width:100%}
.btn.ghost{padding:8px 14px;border-radius:14px;font-size:12px;font-weight:700;color:var(--mut);background:var(--sf);box-shadow:var(--clay-s)}
header{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 16px) 16px 8px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
header h1{font-size:24px;font-weight:900;letter-spacing:-.03em;margin-right:auto}
.arenas{display:flex;gap:8px;flex-wrap:wrap}
.arenas button,.rchips button{padding:8px 14px;border-radius:16px;background:var(--sf);box-shadow:var(--clay-s);color:var(--mut);font-weight:700;font-size:13px}
.arenas button.on,.rchips button.on{box-shadow:var(--inset);background:var(--pri-l);color:var(--pri)}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.themebtn{width:42px;height:42px;border-radius:15px;background:var(--sf);box-shadow:var(--clay-s);display:grid;place-items:center;color:var(--mut)}
.wrap{max-width:1400px;margin:0 auto;padding:8px 16px calc(28px + var(--safe-b));display:grid;gap:16px}
.card{background:var(--sf);box-shadow:var(--clay);border-radius:28px;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top small{display:block}.val{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.chg{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:12px;margin-left:8px;vertical-align:middle}
.chg.u{background:var(--up-l);color:var(--up)}.chg.d{background:var(--dn-l);color:var(--dn)}
.cb{position:relative;height:300px;contain:layout paint}
.sec .cb{height:210px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--mut);font-size:12px;font-weight:600}
.badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;background:var(--dn);color:#fff}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1400px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.cb{height:400px}.sec .cb{height:240px}.val{font-size:36px}}
@media(max-width:520px){header h1{font-size:20px}.card{padding:14px;border-radius:24px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/chart.js"></script>
<script src="/icons.js"></script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compact = n => n >= 1e12 ? '$' + (n / 1e12).toFixed(2) + 'T' : n >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : '$' + (n / 1e6).toFixed(0) + 'M';
const pc = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const RANGES = [['10m', 600], ['30m', 1800], ['2h', 7200], ['All', 0]];
let KEY = sessionStorage.getItem('gk') || '', R = 'alpha', OV = null, timer, span = 1800, charts = {}, ser = {}, sig = '';
const root = $('#root');

const themeMode = () => localStorage.getItem('br_theme') || 'auto';
const isDark = () => { const m = themeMode(); return m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); };
function applyTheme(mode) {
  if (mode) localStorage.setItem('br_theme', mode);
  document.documentElement.dataset.theme = isDark() ? 'dark' : 'light';
  Chart._c = null; Object.values(charts).forEach(c => c.draw());
  const b = $('#themebtn'); if (b) b.innerHTML = ic(isDark() ? 'sun' : 'moon');
}

async function api(path) {
  const r = await fetch('/api/graph/' + path, { headers: { 'X-Graph': KEY } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

function gate(msg = '') {
  clearInterval(timer); Object.values(charts).forEach(c => c.destroy()); charts = {}; sig = '';
  root.innerHTML = `<div class="gate"><div class="box"><h1>Market graphs</h1><small>Enter the graph key to view the charts.</small>
    <input id="key" type="password" placeholder="Graph key" autofocus><button class="btn full" id="in">Unlock</button><div class="dn" id="msg">${esc(msg)}</div></div></div>`;
  const go = async () => { KEY = $('#key').value; try { await api('overview?realm=' + R); sessionStorage.setItem('gk', KEY); start(); } catch (e) { $('#msg').textContent = e.message; } };
  $('#in').onclick = go; $('#key').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function start() {
  root.innerHTML = `<header><h1>Market graphs</h1><div class="arenas" id="arenas"></div><button class="themebtn" id="themebtn" aria-label="Toggle dark mode"></button><button class="btn ghost" id="out">Lock</button></header>
    <div class="tools"><div class="rchips" id="rc">${RANGES.map(r => `<button data-r="${r[1]}" class="${r[1] === span ? 'on' : ''}">${r[0]}</button>`).join('')}</div><small>Drag to move. Pinch or scroll to zoom. Double-click to reset.</small></div>
    <div class="wrap" id="wrap"></div>`;
  $('#out').onclick = () => { sessionStorage.removeItem('gk'); KEY = ''; gate(); };
  $('#themebtn').onclick = () => applyTheme(isDark() ? 'light' : 'dark');
  $('#rc').onclick = e => { const b = e.target.closest('button'); if (!b) return; span = +b.dataset.r; $$('#rc button').forEach(x => x.classList.toggle('on', x === b)); Object.values(charts).forEach(c => c.setSpan(span)); };
  applyTheme(); load();
  clearInterval(timer); timer = setInterval(live, 1000);
}

async function load() {
  try {
    OV = await api('overview?realm=' + R);
    $('#arenas').innerHTML = OV.realms.map(r => `<button data-a="${r.id}" class="${r.id === R ? 'on' : ''}">${esc(r.name)}${r.open ? '' : ' (closed)'}</button>`).join('');
    $$('#arenas button').forEach(b => b.onclick = () => { R = b.dataset.a; sig = ''; load(); });
    const key = R + OV.sectors.map(s => s.name).join();
    if (key !== sig) { sig = key; await build(); }
    paint();
  } catch (e) { if (/key/i.test(e.message)) gate(e.message); }
}

function card(id, title, cls) {
  return `<section class="card ${cls}"><div class="top"><div><small>${esc(title)}</small><div class="val" id="v-${cssId(id)}"></div></div><div id="s-${cssId(id)}" class="meta"></div></div><div class="cb" id="c-${cssId(id)}"></div></section>`;
}
const cssId = id => id.replace(/[^A-Za-z0-9]/g, '_');

async function build() {
  Object.values(charts).forEach(c => c.destroy()); charts = {}; ser = {};
  $('#wrap').innerHTML = card('INDEX', 'Total market index', 'main') + `<div class="grid">${OV.sectors.map(s => card(s.name, s.name + ' sector', 'sec')).join('')}</div>`;
  const ids = ['INDEX', ...OV.sectors.map(s => s.name)];
  await Promise.all(ids.map(async id => {
    ser[id] = { t: [], v: [] };
    try { const h = await api('history?realm=' + R + '&id=' + encodeURIComponent(id)); ser[id].t = h.t; ser[id].v = h.v; } catch (e) { }
    const ch = new Chart($('#c-' + cssId(id)), { source: ser[id], interactive: true, touch: 'pan-y', fmt, minSpan: 20 });
    ch.sid = id; charts[id] = ch; ch.setSpan(span);
  }));
}

function info(id) {
  if (id === 'INDEX') return OV.ix;
  const s = OV.sectors.find(x => x.name === id); return s;
}

function paint() {
  if (!OV) return;
  const ids = ['INDEX', ...OV.sectors.map(s => s.name)];
  ids.forEach(id => {
    const d = info(id), v = $('#v-' + cssId(id)), m = $('#s-' + cssId(id)); if (!d || !v) return;
    const ch = d.open ? (d.v / d.open - 1) * 100 : 0;
    v.innerHTML = `${fmt(d.v)}<span class="chg ${ch >= 0 ? 'u' : 'd'}">${pc(ch)}</span>`;
    m.innerHTML = `<span>Open ${fmt(d.open)}</span><span>High ${fmt(d.high)}</span><span>Low ${fmt(d.low)}</span>` + (d.cap ? `<span>${compact(d.cap)}</span><span>${d.adv} of ${d.n} up</span>` : '') + (id === 'INDEX' && !OV.open ? '<span class="badge">Closed</span>' : id === 'INDEX' && OV.paused ? '<span class="badge">Paused</span>' : '');
    const ch2 = charts[id]; if (ch2) { const o = d.open; ch2.o.base = () => o; ch2.lines = [{ y: o, color: Chart.colors().mut, dash: [6, 4], label: 'Session open' }]; ch2.draw(); }
  });
}

async function live() {
  if (document.hidden || !OV) return;
  try {
    const l = await api('live?realm=' + R);
    if (l.n.join() !== OV.sectors.map(s => s.name).join()) { load(); return; }
    OV.open = l.open; OV.paused = l.paused;
    OV.ix = { v: l.ix[0], open: l.ix[1], high: l.ix[2], low: l.ix[3] };
    OV.sectors.forEach(s => { const x = l.s[s.name]; if (x) { s.v = x[0]; s.open = x[1]; s.high = x[2]; s.low = x[3]; } });
    const push = (id, v) => { const s = ser[id]; if (!s) return; const n = s.t.length; if (n && l.t <= s.t[n - 1]) return; if (l.open && !l.paused) { s.t.push(l.t); s.v.push(v); } if (n > 9000) { s.t.splice(0, 1500); s.v.splice(0, 1500); } };
    push('INDEX', l.ix[0]); OV.sectors.forEach(s => push(s.name, s.v));
    Object.values(charts).forEach(c => c.appended());
    paint();
  } catch (e) { if (/key/i.test(e.message)) gate(e.message); }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && OV) { sig = ''; load(); } });
(async function () { applyTheme(); if (KEY) { try { await api('overview?realm=' + R); start(); return; } catch (e) { } } gate(); })();
</script>
</body>
</html>
